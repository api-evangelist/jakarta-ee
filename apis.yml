aid: jakarta-ee
name: Jakarta EE
description: >-
  Jakarta EE is the open source successor to Java EE, providing a set of
  specifications for enterprise Java development. Jakarta EE is developed
  under the Eclipse Foundation and includes specifications for web services,
  messaging, persistence, security, and other enterprise computing needs.
